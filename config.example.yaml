# radio-agent configuration
# Copy to config.yaml and edit. Every key has a default, so you only need to set what changes.

station:
  callsign: "N0CALL"          # YOUR callsign – change this. Spoken phonetically when the station IDs
  id_every_over: false        # true = full phonetic ID every over; false = first over, every id_interval_seconds, and on sign-off
  id_interval_seconds: 600
  operator: ""                # the station calling in (your handheld's call). Used when their call isn't heard in the over
  # Screen-only: shown on the demo page and the run.bat banner
  name: ""                    # e.g. "Stephen" – the character the agent plays
  qth: ""                     # e.g. "Rockall"
  locator: ""                 # Maidenhead locator, e.g. IO37do
  frequency: ""               # dial shown on the screens, e.g. "145.660"; blank = rtlsdr.frequency

radio:
  # "text"      – type at the keyboard, replies printed. No audio. Great for testing the loop.
  # "soundcard" – real radio via a USB sound card (AIOC, Digirig, CM108 dongle...)
  # "dmr"       – DMR handheld via your MMDVM hotspot + DVSwitch Analog_Bridge (see docs/dmr.md)
  mode: text
  # How the agent answers you:
  #   "radio"   – transmits the reply back over the base radio (needs PTT/VOX + ID)
  #   "speaker" – reads the reply out on the PC speakers, nothing transmitted
  #   "screen"  – shows it in the terminal and the sidecar page only (receive-only station)
  reply: radio
  input_device: null          # sounddevice name/index; null = default. Run `radio-agent devices` to list.
  output_device: null
  sample_rate: 16000          # Baofeng audio is narrowband; 16 kHz is plenty and what Whisper wants
  squelch_threshold: 0.02     # RMS level that counts as "someone is talking". Tune with `radio-agent calibrate`.
  open_ms: 120                # audio must stay above threshold this long to start recording
  hang_ms: 900                # silence this long ends your over
  max_listen_seconds: 60
  ptt:
    # "vox"    – no PTT line; enable VOX on the base radio (Plan B / Plan C)
    # "serial" – key PTT with DTR/RTS on a serial port (AIOC shows up as /dev/ttyACM0)
    # "none"   – don't transmit at all (receive-only testing)
    type: vox
    port: /dev/ttyACM0
    # AIOC default: PTT asserted with DTR=1, RTS=0. Check your cable's docs and flip if needed.
    assert_dtr: true
    assert_rts: false
    tx_delay_ms: 300          # key up, wait for the radio to start transmitting, then talk
    tx_tail_ms: 200
  vox_lead_in_ms: 250         # VOX mode: short tone before speech so VOX opens without clipping words
  max_tx_seconds: 45          # hard cap per transmission; long replies are split into several overs
  tx_gain: 1.0                # TX level, applied after normalising each over to peak 0.9. <1 quieter, >1 louder (peaks soft-limited)

dmr:
  # Only used when radio.mode is "dmr". Ports must match Analog_Bridge.ini [USRP].
  listen_port: 32001          # = Analog_Bridge txPort (it sends voice to us)
  bridge_port: 34001          # = Analog_Bridge rxPort (we send replies to it)
  end_of_over_timeout: 1.0    # seconds of no frames = end of over (if no keyup=0 arrives)
  # Only answer these stations. DMR IDs aren't authenticated, but it stops strays. Empty = anyone.
  allowed_callsigns: []      # e.g. ["N0CALL"] to answer only your own DMR radio
  allowed_ids: []

listen:
  # Words that wake the agent when it's idle. After a reply it stays "in conversation"
  # for conversation_window_seconds so you don't need the wake word every over.
  wake_words: ["claude", "agent", "computer"]
  conversation_window_seconds: 180
  # Optional DTMF PIN. If set, key  * <pin> #  on your handheld to unlock. Re-locks after idle.
  # Remember DTMF is sent in the clear – this stops randoms, not a determined listener.
  pin: null
  lock_after_idle_seconds: 900

stt:
  # "faster-whisper" (local), "openai" (API, good for Pi Zero), "none" (text mode)
  backend: faster-whisper
  model: base.en              # tiny.en for a Pi 4, small.en if you have the CPU
  openai_model: whisper-1
  # Words Whisper should expect – helps a lot with jargon and callsigns
  hint: "N0CALL, Claude, radio check, over, confirm, negative, Next.js, Prisma, npm, git"

agent:
  # "claude-code" – runs the Claude Code CLI in your project folder. Can read, edit, run tests.
  # "anthropic" / "openai" / "ollama" – plain chat (no file access), good for Q&A
  # "echo" – repeats you back. For testing the radio side.
  backend: claude-code
  workdir: ~/radio-sandbox    # project the agent works in. Keep it a sandbox, not production!
  # Tools Claude Code may use once you say "confirm". Reading is always allowed.
  allowed_tools: ["Read", "Edit", "Write", "Glob", "Grep", "Bash(npm test:*)", "Bash(npm run:*)", "Bash(git diff:*)", "Bash(git status:*)"]
  model: null                 # e.g. claude-sonnet-4-5 / gpt-4o-mini / llama3.1:8b
  persona: ""                 # optional character for the agent to play, added to its instructions
  ollama_url: http://localhost:11434
  timeout_seconds: 600

tts:
  # "piper" (local, natural), "espeak" (robotic but everywhere), "sapi" (Windows built-in voices),
  # "dectalk" (Windows, classic 1980s voices), "openai", "print" (text mode)
  backend: piper
  sapi_voice: ""              # e.g. "Microsoft George Desktop"; blank = first British voice installed
  piper_model: ~/piper/en_GB-alan-medium.onnx
  openai_voice: onyx
  dectalk_path: ""            # DECtalk `say` (or its folder, or the Windows DECtalk.dll folder); blank = PATH, ./dectalk, ~/dectalk
  dectalk_voice: paul         # paul, harry, frank, dennis, betty, ursula, wendy, rita, kit
  dectalk_rate: 180           # words per minute
  fallback: ""                # e.g. "sapi": used (with a warning) if this backend's program isn't installed
  # Words every voice should say differently. Whole words, any case, added to the built-in list
  # (WAV, SSTV, QSO, MHz, 73, Rockall...). Map a word to "" to drop a built-in one.
  pronunciations: {}
  #   Strathearn: "Strath-ern"

sstv:
  # Say "SSTV" in an over and a slow-scan picture of the station paints on the /demo page; "close" shuts it
  seconds: 5                  # how long it takes to paint
  play_audio: false           # true = also play real, decodable SSTV audio out of the reply output (full mode length)
  mode: robot36               # robot36 (36 s) | martin1 (115 s)
  folder: sstv                # your own photos to send (jpg/png); none there = the built-in picture
  picture: testcard           # built-in picture: testcard | rockall
  source: picture             # what "SSTV" sends: picture | wefax (latest NOAA weather chart for the area you name)

wefax:
  # "send me a weather fax for Biscay" – the latest radiofax chart from NOAA for that area
  default_region: ne_atlantic # ne_atlantic nw_atlantic tropical_atlantic gulf ne_pacific nw_pacific
                              # tropical_pacific central_pacific alaska
  seconds: 8                  # how long a chart takes to paint

cq:
  enabled: false              # the station calls CQ on its own at random intervals, pausing during a QSO
  interval_seconds: [60, 120]
  first_after_seconds: 20
  quiet_after_seconds: 45     # resume this long after the last thing heard or said in a QSO
  on_air: false               # allow automatic CQs over the radio (unattended TX – check your licence)

qso:
  # The station adds every callsign; the agent only writes the message. {me} {them} = callsigns said
  # plainly ("N zero C A L L"), {me_phonetic} {them_phonetic} = phonetically. A [part] is left out
  # when the other station's call isn't known (not heard in the over, and no station.operator).
  new_after_minutes: 10       # nothing exchanged this long = the next over opens a new QSO
  opening: "[{them_phonetic}, ]this is {me_phonetic}."   # first over of a QSO, and every id_interval_seconds
  handover: "[Over to {them}, ]{me}, over."
  short_opening: "[{them}.]"                             # quick back-and-forth
  short_handover: "{me}, over."
  continuing: "{me}, continuing."                        # earlier parts of a long reply
  closing: "Seventy-three, [{them_phonetic}, ]this is {me_phonetic}, clear."
  cq_answer_minutes: 5        # a new QSO this soon after our CQ = someone answering it: a contact the station leads

weather:
  # The real weather where the station is, for its weather report (Open-Meteo: free, no key)
  enabled: true
  latitude: null              # null = the middle of station.locator
  longitude: null
  place: ""                   # blank = station.qth

logbook:
  # Contacts in ADIF, for your logger / LoTW / QRZ. Callsigns are checked on HamQTH.com when
  # HAMQTH_USER and HAMQTH_PASS are in .env (a free account)
  enabled: true
  file: logs/{callsign}.adi

sidecar:
  # Small web page for the stuff that doesn't speak well: code, diffs, paths, logs.
  enabled: true
  host: 0.0.0.0
  port: 8073
  token: change-me            # open http://<pi>:8073/?t=change-me on your phone
  open_demo: false            # open the WSJT-X style demo screen (…/demo?t=…) in the browser at start-up
  title: RADIO-AGENT          # name shown on the demo screen
