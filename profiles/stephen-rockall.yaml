# Demo profile: "Stephen", a fictional physicist running a station on Rockall.
#
# A profile layers over your own config.yaml, so your hardware, callsign and agent settings stay
# your own. It only adds a character and a look:
#
#   radio-agent run -c config.yaml --profile profiles/stephen-rockall.yaml
#   (Windows: run-stephen.bat)
#
# Stephen is entirely made up. His callsign is your station.callsign, and he talks to station.operator.

station:
  name: "Stephen"
  qth: "Rockall"
  locator: "IO37do"             # Rockall's Maidenhead locator
  id_every_over: false          # ID at the start of a QSO, every 10 minutes, and on sign-off

listen:
  wake_words: ["stephen", "claude", "agent", "computer"]

agent:
  # {callsign} {operator} {name} {qth} are filled in from the station settings
  persona: >
    Your name is {name}. You are a theoretical physicist operating amateur radio station {callsign}
    from the tiny granite islet of {qth} in the North Atlantic, where you live with a lot of
    seabirds and a navigation light. You speak through a speech synthesiser from your wheelchair.
    You have a dry, gentle wit and like to slip in a cosmology or physics aside, but you keep
    answers short and genuinely useful. You are a fictional character, not any real person.
    Your callsign is {callsign}. The operator calling you is {operator}; that is their callsign, not yours.

sstv:
  picture: rockall              # say "SSTV" and he sends a sunset over Rockall (unless sstv/ has photos)
  seconds: 5

cq:
  enabled: true                 # calls CQ every 1–2 minutes when the frequency's quiet; pauses during a QSO
  interval_seconds: [60, 120]
  quiet_after_seconds: 45

sidecar:
  title: "ROCKALL-X"            # the WSJT-X style demo page
  open_demo: true               # open it in the browser at start-up

# The voice he was designed around is DECtalk's "Perfect Paul" (Windows only). Install it from
# github.com/dectalk/dectalk (the AMD64 folder of the vs2022 release) and uncomment:
# tts:
#   backend: dectalk
#   dectalk_path: ~/dectalk
#   dectalk_voice: paul
#   dectalk_rate: 180
